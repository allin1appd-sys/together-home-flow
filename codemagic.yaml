workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      groups:
        - ios_creds

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.homehub.appname" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates

          echo "=== Checking profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles found"
          echo "=== Checking certificates ==="
          ls ~/Library/MobileDevice/Certificates/ || echo "No certs found"

          cd ios/App
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.homehub.appname;/g' App.xcodeproj/project.pbxproj
          xcode-project use-profiles --project App.xcodeproj

      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "com.homehub.appname" 2>/dev/null || echo 1)
          NEW_BUILD=$((LATEST + 1))
          echo "Setting build number to $NEW_BUILD"
          # Update Info.plist directly
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" ios/App/App/Info.plist
          # Also update project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" ios/App/App.xcodeproj/project.pbxproj
          # Verify
          echo "Info.plist version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/App/App/Info.plist

      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "com.homehub.appname" 2>/dev/null || echo 1)
          NEW_BUILD=$((LATEST + 1))
          echo "Building with build number: $NEW_BUILD"

          # Set it everywhere possible
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEW_BUILD" ios/App/App/Info.plist
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" ios/App/App.xcodeproj/project.pbxproj

          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --build-arguments="CURRENT_PROJECT_VERSION=$NEW_BUILD"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

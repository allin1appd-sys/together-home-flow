workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      node: 22
      xcode: latest
      groups:
        - ios_creds

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "com.homehub.appname" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          cd ios/App
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = com.homehub.appname;/g' App.xcodeproj/project.pbxproj
          xcode-project use-profiles --project App.xcodeproj

      - name: Build IPA
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 2" ios/App/App/Info.plist
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = 2;/g" ios/App/App.xcodeproj/project.pbxproj
          echo "Build number set to:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/App/App/Info.plist
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App

    artifacts:
      - ios/App/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
